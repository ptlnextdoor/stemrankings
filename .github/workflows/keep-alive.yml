name: keep-alive
# Free Supabase projects pause after ~7 days without activity. This reads one public row daily.
# Uses the public anon key (safe to expose; RLS limits it to the heartbeat table).
on:
  schedule:
    - cron: '17 9 * * *'
  workflow_dispatch:
jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - run: |
          code=$(curl -s -o /dev/null -w '%{http_code}' \
            "https://oxcnlommtnziwfbpxigd.supabase.co/rest/v1/heartbeat?select=id" \
            -H "apikey: ${{ vars.SUPABASE_ANON_KEY }}")
          echo "status $code"
          test "$code" = 200
