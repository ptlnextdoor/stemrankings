name: daily-health
# Once a day: check the site and key endpoints are up, and pull yesterday's errors and traffic from
# owner_health(). Anything wrong opens (or updates) one GitHub issue, which GitHub emails to the owner.
on:
  schedule:
    - cron: '0 15 * * *'   # 7-8am Pacific
  workflow_dispatch:
permissions:
  issues: write
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - name: Probe site, functions and errors
        id: probe
        env:
          SR: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          ANON: ${{ vars.SUPABASE_ANON_KEY }}
        run: |
          U=https://oxcnlommtnziwfbpxigd.supabase.co
          problems=""
          site=$(curl -s -o /dev/null -w '%{http_code}' https://needalab.com/)
          [ "$site" = 200 ] || problems="$problems\n- needalab.com returned $site"
          find=$(curl -s -o /dev/null -w '%{http_code}' -X POST $U/functions/v1/find -H "apikey: $ANON" -H 'Content-Type: application/json' -d '{"query":"soft robotics"}')
          [ "$find" = 200 ] || problems="$problems\n- search (find) returned $find"
          prof=$(curl -s -o /dev/null -w '%{http_code}' -X POST $U/functions/v1/professor -H "apikey: $ANON" -H 'Content-Type: application/json' -d '{"id":"A5058930967"}')
          [ "$prof" = 200 ] || problems="$problems\n- professor panel returned $prof"
          h=$(curl -s -X POST $U/rest/v1/rpc/owner_health -H "apikey: $SR" -H "Authorization: Bearer $SR" -H 'Content-Type: application/json' -d '{}')
          errs=$(echo "$h" | python3 -c 'import json,sys;print(json.load(sys.stdin)["errors_24h"])' 2>/dev/null || echo "?")
          [ "$errs" = "?" ] && problems="$problems\n- couldn't read owner_health()"
          [ "$errs" != "?" ] && [ "$errs" -gt 20 ] && problems="$problems\n- $errs browser errors in the last 24h"
          summary=$(echo "$h" | python3 -c 'import json,sys;d=json.load(sys.stdin);print("views %s, signups %s, errors %s. Top errors: %s" % (d["views_24h"], d["signups_24h"], d["errors_24h"], "; ".join("%s (x%s)" % (e["detail"], e["n"]) for e in d["top_errors"]) or "none"))' 2>/dev/null)
          echo "summary=$summary" >> "$GITHUB_OUTPUT"
          { echo "problems<<EOF"; [ -n "$problems" ] && printf "%b\n" "$problems"; echo "EOF"; } >> "$GITHUB_OUTPUT"
          [ -n "$problems" ] && echo "failed=true" >> "$GITHUB_OUTPUT"
          echo "site=$site find=$find prof=$prof errors=$errs"
      - name: Open or update the health issue
        if: steps.probe.outputs.failed == 'true'
        uses: actions/github-script@v7
        with:
          script: |
            const title = "needalab health check failed";
            const body = `${{ steps.probe.outputs.problems }}\n\nLast 24h: ${{ steps.probe.outputs.summary }}\n\nRun: ${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`;
            const { data: open } = await github.rest.issues.listForRepo({ ...context.repo, state: "open", labels: "health" });
            if (open.length) await github.rest.issues.createComment({ ...context.repo, issue_number: open[0].number, body });
            else await github.rest.issues.create({ ...context.repo, title, body, labels: ["health"] });
